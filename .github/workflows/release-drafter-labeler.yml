name: Release Drafter Auto Labeler

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-labeler:
    runs-on: ubuntu-latest
    steps:
      # Labels the pull request from its branch name / body so the changelog
      # categories in `.github/release-drafter.yml` get filled in correctly.
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
          disable-releaser: true # only run auto-labeler for PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
